# Hooks are convenience; CI re-runs everything and is the authority
# (SPRINT_0_PLAN §17). Order: ruff-format -> ruff -> mypy -> eslint/prettier
# -> import-boundary -> gitleaks -> commit-lint -> .env.example drift guard.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff-format
        files: ^apps/api/
      - id: ruff
        args: [--fix]
        files: ^apps/api/
  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict (apps/api)
        entry: bash -c 'cd apps/api && uv run mypy'
        language: system
        pass_filenames: false
        files: ^apps/api/src/
      - id: eslint
        name: eslint (apps/web)
        entry: bash -c 'cd apps/web && npm run lint'
        language: system
        pass_filenames: false
        files: ^apps/web/src/
      - id: prettier
        name: prettier --check (apps/web)
        entry: bash -c 'cd apps/web && npm run format:check'
        language: system
        pass_filenames: false
        files: ^apps/web/src/
      - id: import-boundaries
        name: import boundaries (Blueprint §3.3)
        entry: bash -c 'cd apps/api && uv run lint-imports --config pyproject.toml'
        language: system
        pass_filenames: false
        files: ^apps/api/src/
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
  - repo: local
    hooks:
      - id: env-example-drift
        name: .env.example drift guard
        entry: make env-check
        language: system
        pass_filenames: false
        files: ^(\.env|\.env\.example)$
