[project]
name = "aether-api"
version = "0.1.0"
description = "Aether AI Workspace — API and worker (one codebase, two entrypoints; Blueprint D3-1)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic[email]>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "structlog>=24.1,<25",
  "asyncpg>=0.29,<1",
  "redis>=5.0,<6",
  "argon2-cffi>=23.1,<24",
  "pyjwt[crypto]>=2.9,<3",
  "cryptography>=50.0,<51",  # >=50.0 for PYSEC-2026-3552 (below other fixed-in versions too)
  "uuid-utils>=0.9,<1",
  "alembic>=1.13,<2",
  "greenlet>=3.0,<4",  # required by SQLAlchemy's async engine (Alembic's migration runner, migrations/env.py)
  "httpx>=0.27,<1",  # Resend adapter's HTTP client (ADR-11.1) — already a dev dep for TestClient
  "pgvector>=0.3,<1",  # asyncpg codec for the `vector` column type (S5, D3-2/ADR-3.2)
  "minio>=7.2,<8",  # S3-compatible object storage client, presigned URLs (S5, ADR-3.8)
  "pypdf>=6.13,<7",  # PDF parsing, ingestion pipeline (S5, §3.2.7); >=6.13 for the run of PYSEC-2026-1827..3024 CVEs fixed across the 6.x line
  "python-docx>=1.1,<2",  # DOCX parsing, ingestion pipeline (S5, §3.2.7)
  "markdown-it-py>=3.0,<4",  # CommonMark parsing, ingestion pipeline (S5, §3.2.7)
  "beautifulsoup4>=4.12,<5",  # HTML parsing, ingestion pipeline (S5, §3.2.7)
  "filetype>=1.2,<2",  # pure-Python magic-byte type detection, never trusts extensions (S5, §3.2.7)
  "tiktoken>=0.8,<1",  # token counting for chunk sizing (S5, ADR-6.2)
  "prometheus-client>=0.20,<1",  # /metrics exposition (S9, §10.4)
  "opentelemetry-api>=1.27,<2",  # tracing (S9, NFR-O-1, §3.8)
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-asyncpg>=0.48b0",
  "opentelemetry-instrumentation-httpx>=0.48b0",
  "opentelemetry-instrumentation-redis>=0.48b0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24,<1",
  "httpx>=0.27",
  "mypy>=1.11",
  "ruff>=0.6",
  "import-linter>=2.0",
  "testcontainers[postgres,redis]>=4.8,<5",
  "asgi-lifespan>=2.1,<3",
  "schemathesis>=3.35,<4",  # OpenAPI conformance testing, in-process (S10 #107, ADR-9.2/§10.5)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aether"]

# ---------------------------------------------------------------- ruff -----
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F",      # pycodestyle / pyflakes
  "I",                # isort
  "B",                # bugbear (mutable defaults, etc.)
  "UP",               # pyupgrade
  "S",                # bandit security rules
  "N",                # naming
  "T20",              # no stray print()
  "RUF",
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",         # assert is the point of tests
  "S105", "S106", # fixture literals like "wrong-password" aren't credentials
]
"src/aether/http/**" = [
  "B008", # Depends(...)/Header(...)/Cookie(...) as argument defaults is
          # FastAPI's own documented DI idiom, not the mutable-default-
          # argument footgun this rule exists to catch.
]
"src/aether/adapters/redis/rate_limiter.py" = [
  "S105", # the Lua script constant trips the hardcoded-password
          # heuristic; it's Lua source, not a credential. A trailing
          # `# noqa` isn't usable here — everything after `"""` on the
          # opening line of an unclosed multi-line string is part of the
          # string itself, not a comment.
]
"../../evals/harness/**" = [
  "S105", # the harness's own throwaway eval-user password (runner.py) —
          # same non-credential posture as tests/**'s fixture literals.
  "T201", # cli.py is a human-facing CLI tool; stdout output is the point.
]
"scripts/**" = [
  "T201", # standalone CLI scripts (e.g. export_openapi.py) — stdout output is the point.
]

# ---------------------------------------------------------------- mypy -----
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src/aether", "scripts"]
warn_unreachable = true
show_error_codes = true

# asyncpg ships no py.typed marker / stubs (Sprint 1) — narrowly silenced
# for that one package rather than loosening strict mode repo-wide.
[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

# testcontainers ships no py.typed marker either (integration tests only).
[[tool.mypy.overrides]]
module = "testcontainers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "filetype.*"
ignore_missing_imports = true

# -------------------------------------------------------- import-linter ----
# Enforces Blueprint §3.3: domain imports nothing internal; layered flow
# http -> app -> (ports, domain); adapters may import ports only.
[tool.importlinter]
root_package = "aether"

[[tool.importlinter.contracts]]
name = "Domain is pure (imports no other internal layer)"
type = "forbidden"
source_modules = ["aether.domain"]
forbidden_modules = [
  "aether.app", "aether.ports", "aether.adapters",
  "aether.http", "aether.workers", "aether.modules",
]

[[tool.importlinter.contracts]]
name = "Layered architecture (inbound -> application -> domain)"
type = "layers"
layers = ["aether.http | aether.workers", "aether.app", "aether.ports", "aether.domain"]

[[tool.importlinter.contracts]]
name = "Adapters depend only on ports (never on app/http/domain/modules)"
type = "forbidden"
source_modules = ["aether.adapters"]
forbidden_modules = [
  "aether.app", "aether.http", "aether.workers",
  "aether.domain", "aether.modules",
]
# Ports (e.g. UserRepositoryPort.create() -> User) are typed against
# domain entities/errors, so an adapter implementing a port transitively
# reaches domain through it — ports re-export the specific domain types
# each adapter needs (see ports/repositories.py, ports/security.py) so
# that's the only doorway. This flag scopes the contract to what "ports
# only" is actually enforcing: no adapter file may write
# `from aether.domain import ...` directly.
allow_indirect_imports = true

# --------------------------------------------------------------- pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
# Repo root on sys.path so tests/integration/test_eval_harness.py can
# import evals.harness.* (Sprint 7's harness lives outside apps/api —
# it's a consumer of the product, not part of it, see evals/harness/
# __init__.py's docstring) without a separate package/dependency setup.
pythonpath = ["../.."]
markers = [
  "unit: fast, no I/O, fake ports only",
  "integration: real PG/Redis via testcontainers (enabled S1+)",
  "contract: OpenAPI conformance (schemathesis)",
  "security: authz matrix / cross-tenant red team (enabled S1+)",
  "architecture: import-boundary and structural rules",
  "chaos: infra-kill experiments against real containers (S9 #97) — slow, opt-in/nightly, not in the default PR lane",
]

# ------------------------------------------------------------- coverage ----
[tool.coverage.run]
source = ["src/aether"]
omit = ["src/aether/adapters/*"]  # vendor-glue exclusion, justified in SPRINT_0_PLAN §18

[tool.coverage.report]
fail_under = 80  # NFR-M-1; combined unit+architecture+integration+security run is at 94%
