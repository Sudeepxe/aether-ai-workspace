[project]
name = "aether-api"
version = "0.1.0"
description = "Aether AI Workspace — API and worker (one codebase, two entrypoints; Blueprint D3-1)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic[email]>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "structlog>=24.1,<25",
  "asyncpg>=0.29,<1",
  "redis>=5.0,<6",
  "argon2-cffi>=23.1,<24",
  "pyjwt[crypto]>=2.9,<3",
  "cryptography>=50.0,<51",  # >=50.0 for PYSEC-2026-3552 (below other fixed-in versions too)
  "uuid-utils>=0.9,<1",
  "alembic>=1.13,<2",
  "greenlet>=3.0,<4",  # required by SQLAlchemy's async engine (Alembic's migration runner, migrations/env.py)
  "httpx>=0.27,<1",  # Resend adapter's HTTP client (ADR-11.1) — already a dev dep for TestClient
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24,<1",
  "httpx>=0.27",
  "mypy>=1.11",
  "ruff>=0.6",
  "import-linter>=2.0",
  "testcontainers[postgres,redis]>=4.8,<5",
  "asgi-lifespan>=2.1,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aether"]

# ---------------------------------------------------------------- ruff -----
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F",      # pycodestyle / pyflakes
  "I",                # isort
  "B",                # bugbear (mutable defaults, etc.)
  "UP",               # pyupgrade
  "S",                # bandit security rules
  "N",                # naming
  "T20",              # no stray print()
  "RUF",
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",         # assert is the point of tests
  "S105", "S106", # fixture literals like "wrong-password" aren't credentials
]
"src/aether/http/**" = [
  "B008", # Depends(...)/Header(...)/Cookie(...) as argument defaults is
          # FastAPI's own documented DI idiom, not the mutable-default-
          # argument footgun this rule exists to catch.
]
"src/aether/adapters/redis/rate_limiter.py" = [
  "S105", # the Lua script constant trips the hardcoded-password
          # heuristic; it's Lua source, not a credential. A trailing
          # `# noqa` isn't usable here — everything after `"""` on the
          # opening line of an unclosed multi-line string is part of the
          # string itself, not a comment.
]

# ---------------------------------------------------------------- mypy -----
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["aether"]
warn_unreachable = true
show_error_codes = true

# asyncpg ships no py.typed marker / stubs (Sprint 1) — narrowly silenced
# for that one package rather than loosening strict mode repo-wide.
[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

# testcontainers ships no py.typed marker either (integration tests only).
[[tool.mypy.overrides]]
module = "testcontainers.*"
ignore_missing_imports = true

# -------------------------------------------------------- import-linter ----
# Enforces Blueprint §3.3: domain imports nothing internal; layered flow
# http -> app -> (ports, domain); adapters may import ports only.
[tool.importlinter]
root_package = "aether"

[[tool.importlinter.contracts]]
name = "Domain is pure (imports no other internal layer)"
type = "forbidden"
source_modules = ["aether.domain"]
forbidden_modules = [
  "aether.app", "aether.ports", "aether.adapters",
  "aether.http", "aether.workers", "aether.modules",
]

[[tool.importlinter.contracts]]
name = "Layered architecture (inbound -> application -> domain)"
type = "layers"
layers = ["aether.http | aether.workers", "aether.app", "aether.ports", "aether.domain"]

[[tool.importlinter.contracts]]
name = "Adapters depend only on ports (never on app/http/domain/modules)"
type = "forbidden"
source_modules = ["aether.adapters"]
forbidden_modules = [
  "aether.app", "aether.http", "aether.workers",
  "aether.domain", "aether.modules",
]
# Ports (e.g. UserRepositoryPort.create() -> User) are typed against
# domain entities/errors, so an adapter implementing a port transitively
# reaches domain through it — ports re-export the specific domain types
# each adapter needs (see ports/repositories.py, ports/security.py) so
# that's the only doorway. This flag scopes the contract to what "ports
# only" is actually enforcing: no adapter file may write
# `from aether.domain import ...` directly.
allow_indirect_imports = true

# --------------------------------------------------------------- pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = [
  "unit: fast, no I/O, fake ports only",
  "integration: real PG/Redis via testcontainers (enabled S1+)",
  "contract: OpenAPI conformance (schemathesis)",
  "security: authz matrix / cross-tenant red team (enabled S1+)",
  "architecture: import-boundary and structural rules",
]

# ------------------------------------------------------------- coverage ----
[tool.coverage.run]
source = ["src/aether"]
omit = ["src/aether/adapters/*"]  # vendor-glue exclusion, justified in SPRINT_0_PLAN §18

[tool.coverage.report]
fail_under = 80  # NFR-M-1; combined unit+architecture+integration+security run is at 94%
