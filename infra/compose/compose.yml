# Aether compose topology (Blueprint §3.9.1). Profiles:
#   dev  — infra services for local development (functional in Sprint 0)
#   app  — api/worker containers built from source (functional from S1)
#   demo/test — declared in SPRINT_0_PLAN §14; land S9–S11.
# Images pinned by digest, in `image:tag@digest` form (Ch. 10 F-1
# discipline: no `latest`, no mutable tags). Digests captured 2026-08-14.
name: aether

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    profiles: ["dev"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aether}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aether-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-aether}
    ports: ["5432:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    profiles: ["dev"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z@sha256:6f23072e3e222e64fe6f86b31a7f7aca971e5129e55cbccef649b109b8e651a1
    profiles: ["dev"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aether}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aether-dev-only}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.20@sha256:7eef0f38dbc85e4e264f2edf5d70fbb694826791e05cb2cae4fc9e3282f968f5
    profiles: ["dev"]
    ports: ["8025:8025", "1025:1025"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025"]
      interval: 10s
      timeout: 3s
      retries: 5

  clamav:
    # No arm64 build published upstream — explicit platform pin so this
    # runs (emulated) on Apple Silicon dev machines too, not just
    # native-amd64 CI/prod hosts.
    image: clamav/clamav@sha256:7173cd3d57a839c6fee673b07246301e0d1f68f5a14a5ca063f502323bf1cc61
    platform: linux/amd64
    profiles: ["dev"]
    environment:
      # Dev/demo posture: skip the live signature-update check on every
      # boot (network-dependent, ~30-50s) — the image's baked-in
      # database is enough for EICAR-level detection in local dev.
      CLAMAV_NO_FRESHCLAMD: "true"
    ports: ["3310:3310"]
    healthcheck:
      # clamd's own startup is what's slow (loading the signature DB
      # into memory), not this check itself — the long start_period
      # accommodates that instead of the interval/retries doing so.
      test: ["CMD-SHELL", "echo PING | nc -w 2 localhost 3310 | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

  api:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      AETHER_ENV: dev
      # app_api (ADR-8.1, least privilege, RLS-subject) — created by the
      # first migration; run `make migrate` against the dev profile before
      # starting these services.
      AETHER_DATABASE_URL: postgresql://app_api:app-api-dev-only@postgres:5432/${POSTGRES_DB:-aether}
      AETHER_DATABASE_MIGRATOR_URL: postgresql://${POSTGRES_USER:-aether}:${POSTGRES_PASSWORD:-aether-dev-only}@postgres:5432/${POSTGRES_DB:-aether}
      AETHER_REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    command: ["python", "-m", "aether.workers.main"]
    environment:
      AETHER_ENV: dev
      # app_api (ADR-8.1, least privilege, RLS-subject) — created by the
      # first migration; run `make migrate` against the dev profile before
      # starting these services.
      AETHER_DATABASE_URL: postgresql://app_api:app-api-dev-only@postgres:5432/${POSTGRES_DB:-aether}
      AETHER_DATABASE_MIGRATOR_URL: postgresql://${POSTGRES_USER:-aether}:${POSTGRES_PASSWORD:-aether-dev-only}@postgres:5432/${POSTGRES_DB:-aether}
      # app_worker (ADR-8.1, least privilege) — the worker's own outbox
      # dispatch (Sprint 2, ADR-11.1) connects as this role, not app_api.
      AETHER_DATABASE_WORKER_URL: postgresql://app_worker:app-worker-dev-only@postgres:5432/${POSTGRES_DB:-aether}
      AETHER_REDIS_URL: redis://redis:6379/0
      AETHER_EMAIL_PROVIDER: smtp
      AETHER_SMTP_HOST: mailpit
      AETHER_SMTP_PORT: "1025"
      # Object storage + malware scan (Sprint 5, issue #46) — the
      # ingestion consumer this process runs needs both to reach the
      # real minio/clamav services by their compose hostnames, not the
      # config module's localhost dev defaults.
      AETHER_OBJECT_STORAGE_ENDPOINT: minio:9000
      AETHER_OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-aether}
      AETHER_OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-aether-dev-only}
      AETHER_CLAMAV_HOST: clamav
      AETHER_CLAMAV_PORT: "3310"
    depends_on:
      postgres: { condition: service_healthy }
      mailpit: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      clamav: { condition: service_healthy }

volumes:
  pg_data:
  minio_data:
