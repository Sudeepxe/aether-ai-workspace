# Aether compose topology (Blueprint §3.9.1). Profiles:
#   dev  — infra services for local development (functional in Sprint 0)
#   app  — api/worker containers built from source (functional from S1)
#   demo/test — declared in SPRINT_0_PLAN §14; land S9–S11.
name: aether

services:
  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["dev"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aether}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aether-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-aether}
    ports: ["5432:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["dev"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    profiles: ["dev"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aether}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aether-dev-only}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.20
    profiles: ["dev"]
    ports: ["8025:8025", "1025:1025"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      AETHER_ENV: dev
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    command: ["python", "-m", "aether.workers.main"]
    environment:
      AETHER_ENV: dev
    depends_on:
      redis: { condition: service_healthy }

volumes:
  pg_data:
  minio_data:
