# Aether compose topology (Blueprint §3.9.1). Profiles:
#   dev  — infra services for local development (functional in Sprint 0)
#   app  — api/worker containers built from source (functional from S1)
#   observability — LGTM stack: otel-collector, tempo, loki, promtail,
#                   prometheus, alertmanager, grafana (functional S9, §3.8)
#   demo/test — declared in SPRINT_0_PLAN §14; land S10–S11.
# Images pinned by digest, in `image:tag@digest` form (Ch. 10 F-1
# discipline: no `latest`, no mutable tags). Digests captured 2026-08-14
# (dev/app services) and 2026-08-25 (observability services).
name: aether

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    profiles: ["dev"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aether}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aether-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-aether}
    ports: ["5432:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    profiles: ["dev"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z@sha256:6f23072e3e222e64fe6f86b31a7f7aca971e5129e55cbccef649b109b8e651a1
    profiles: ["dev"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aether}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aether-dev-only}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.20@sha256:7eef0f38dbc85e4e264f2edf5d70fbb694826791e05cb2cae4fc9e3282f968f5
    profiles: ["dev"]
    ports: ["8025:8025", "1025:1025"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025"]
      interval: 10s
      timeout: 3s
      retries: 5

  clamav:
    # No arm64 build published upstream — explicit platform pin so this
    # runs (emulated) on Apple Silicon dev machines too, not just
    # native-amd64 CI/prod hosts.
    image: clamav/clamav@sha256:7173cd3d57a839c6fee673b07246301e0d1f68f5a14a5ca063f502323bf1cc61
    platform: linux/amd64
    profiles: ["dev"]
    environment:
      # Dev/demo posture: skip the live signature-update check on every
      # boot (network-dependent, ~30-50s) — the image's baked-in
      # database is enough for EICAR-level detection in local dev.
      CLAMAV_NO_FRESHCLAMD: "true"
    ports: ["3310:3310"]
    healthcheck:
      # clamd's own startup is what's slow (loading the signature DB
      # into memory), not this check itself — the long start_period
      # accommodates that instead of the interval/retries doing so.
      test: ["CMD-SHELL", "echo PING | nc -w 2 localhost 3310 | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

  api:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      AETHER_ENV: dev
      # app_api (ADR-8.1, least privilege, RLS-subject) — created by the
      # first migration; run `make migrate` against the dev profile before
      # starting these services.
      AETHER_DATABASE_URL: postgresql://app_api:app-api-dev-only@postgres:5432/${POSTGRES_DB:-aether}
      AETHER_DATABASE_MIGRATOR_URL: postgresql://${POSTGRES_USER:-aether}:${POSTGRES_PASSWORD:-aether-dev-only}@postgres:5432/${POSTGRES_DB:-aether}
      AETHER_REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    command: ["python", "-m", "aether.workers.main"]
    environment:
      AETHER_ENV: dev
      # app_api (ADR-8.1, least privilege, RLS-subject) — created by the
      # first migration; run `make migrate` against the dev profile before
      # starting these services.
      AETHER_DATABASE_URL: postgresql://app_api:app-api-dev-only@postgres:5432/${POSTGRES_DB:-aether}
      AETHER_DATABASE_MIGRATOR_URL: postgresql://${POSTGRES_USER:-aether}:${POSTGRES_PASSWORD:-aether-dev-only}@postgres:5432/${POSTGRES_DB:-aether}
      # app_worker (ADR-8.1, least privilege) — the worker's own outbox
      # dispatch (Sprint 2, ADR-11.1) connects as this role, not app_api.
      AETHER_DATABASE_WORKER_URL: postgresql://app_worker:app-worker-dev-only@postgres:5432/${POSTGRES_DB:-aether}
      AETHER_REDIS_URL: redis://redis:6379/0
      AETHER_EMAIL_PROVIDER: smtp
      AETHER_SMTP_HOST: mailpit
      AETHER_SMTP_PORT: "1025"
      # Object storage + malware scan (Sprint 5, issue #46) — the
      # ingestion consumer this process runs needs both to reach the
      # real minio/clamav services by their compose hostnames, not the
      # config module's localhost dev defaults.
      AETHER_OBJECT_STORAGE_ENDPOINT: minio:9000
      AETHER_OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-aether}
      AETHER_OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-aether-dev-only}
      AETHER_CLAMAV_HOST: clamav
      AETHER_CLAMAV_PORT: "3310"
    ports: ["9090:9090"]  # prometheus_client's built-in /metrics server (S9)
    depends_on:
      postgres: { condition: service_healthy }
      mailpit: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      clamav: { condition: service_healthy }

  # --- observability profile (S9, §3.8's LGTM stack) ----------------------
  # `docker compose --profile app --profile observability up` — separate
  # from `app` so `make dev`'s inner-loop stays light by default; opt in
  # when you actually want traces/dashboards. Set
  # AETHER_OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 (api/worker's
  # own env, outside this file — same "empty = off" posture as
  # AETHER_OPENAI_API_KEY) to start exporting once this profile is up.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1@sha256:d2da12c4336a79758826700be9e21ecf4a9f7d945b7f8a58ba55ee3fa45427c8
    profiles: ["observability"]
    command: ["--config=/etc/otel-collector/config.yaml"]
    volumes: ["../otel-collector/config.yaml:/etc/otel-collector/config.yaml:ro"]
    ports: ["4317:4317", "4318:4318"]
    depends_on: [tempo]

  tempo:
    image: grafana/tempo:2.6.1@sha256:ef4384fce6e8ad22b95b243d8fc165628cda655376fd50e7850536ad89d71d50
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes: ["../tempo/config.yaml:/etc/tempo/config.yaml:ro", "tempo_data:/var/tempo"]
    ports: ["3200:3200"]

  loki:
    image: grafana/loki:3.3.2@sha256:8af2de1abbdd7aa92b27c9bcc96f0f4140c9096b507c77921ffddf1c6ad6c48f
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes: ["../loki/config.yaml:/etc/loki/config.yaml:ro", "loki_data:/loki"]
    ports: ["3100:3100"]

  promtail:
    image: grafana/promtail:3.3.2@sha256:cb4990801ec58975c5e231057c2bcf204c85fac428eec65ad66e0016c64b9608
    profiles: ["observability"]
    command: ["-config.file=/etc/promtail/config.yaml"]
    volumes:
      - "../promtail/config.yaml:/etc/promtail/config.yaml:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    depends_on: [loki]

  # Standard third-party exporters, not custom code — real Postgres/Redis
  # signal for the Data tier dashboard (§10.4) rather than hand-rolled
  # instrumentation duplicating what these already do well. Requires the
  # `dev` profile also running (they point at its postgres/redis
  # services) — `make dev && make dev-observability` boots both.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0@sha256:386b12d19eab2a37d7cd8ca8b4c7491cc7a830d9581f49af6c98a393da9605e6
    profiles: ["observability"]
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-aether}:${POSTGRES_PASSWORD:-aether-dev-only}@postgres:5432/${POSTGRES_DB:-aether}?sslmode=disable
    ports: ["9187:9187"]

  # Real host disk/CPU/memory (§10.4's "disk > 80%" page-grade alert,
  # #96) — the container/VM this compose stack actually runs on. cert-
  # expiry monitoring (blackbox_exporter) is deliberately NOT added
  # here: there's no real TLS endpoint to probe until S11's Caddy/demo
  # profile exists (D10-1) — the alert rule is defined regardless (see
  # infra/prometheus/rules/), it just has no live target yet. An honest
  # gap, not a faked one.
  node-exporter:
    image: prom/node-exporter:v1.8.2@sha256:4032c6d5bfd752342c3e631c2f1de93ba6b86c41db6b167b9a35372c139e7706
    profiles: ["observability"]
    ports: ["9100:9100"]

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0@sha256:c5a968ba5f30bab5e12181cceb89c4ed37cb4fe4d85490b5b66c7cfe4750b5e8
    profiles: ["observability"]
    environment:
      REDIS_ADDR: redis://redis:6379
    ports: ["9121:9121"]

  prometheus:
    image: prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    profiles: ["observability"]
    volumes:
      - "../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "../prometheus/rules:/etc/prometheus/rules:ro"
      - prometheus_data:/prometheus
    ports: ["9091:9090"]  # host 9090 stays worker's own /metrics port
    depends_on: [alertmanager]

  alertmanager:
    image: prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    profiles: ["observability"]
    volumes: ["../alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
    ports: ["9093:9093"]

  grafana:
    image: grafana/grafana:11.3.1@sha256:fa801ab6e1ae035135309580891e09f7eb94d1abdbd2106bdc288030b028158c
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"  # dev-only convenience (D10-1's demo posture); revisit before any real prod use
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      # Two independent top-level mounts, not one nested inside the
      # other — mounting dashboards *under* the read-only provisioning
      # mount fails ("read-only file system") since Docker can't create
      # a new mountpoint inside an already-mounted read-only tree.
      - "../grafana/provisioning:/etc/grafana/provisioning:ro"
      - "../grafana/dashboards:/etc/grafana/dashboards:ro"
      - grafana_data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus, loki, tempo]

volumes:
  pg_data:
  minio_data:
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data:
