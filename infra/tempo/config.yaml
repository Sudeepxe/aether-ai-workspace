# Tempo config (S9, §3.8's LGTM stack) — single-binary, local-disk mode:
# right-sized for the demo/dev topology (D10-1), not a distributed
# deployment. Swappable to object-storage backends without touching any
# application code (OTLP is the only contract the app depends on).
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

compactor:
  compaction:
    block_retention: 72h
