# Promtail config (S9, §3.8) — ships every compose container's stdout
# (structlog's one-JSON-object-per-line, see aether/logging.py) to Loki.
# `correlation_id` is parsed out as a structured field (LogQL `| json`),
# deliberately *not* promoted to a Loki label — a label per distinct
# request id is exactly the unbounded-cardinality-label anti-pattern
# Loki's own docs warn against. Grafana's trace-to-logs pivot (wired in
# the Tempo datasource's provisioning) instead filters on this field via
# a LogQL query template (`| json | correlation_id="<span_trace_id>"`),
# which is the documented pattern for exactly this case. `level` is a
# label — its cardinality is bounded (DEBUG/INFO/WARNING/ERROR).
server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(aether-(?:api|worker).*)"
        target_label: container
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(aether-(?:api|worker).*)"
        action: keep
    pipeline_stages:
      - json:
          expressions:
            correlation_id: correlation_id
            level: level
            event: event
      - labels:
          level:
