# Deploy pipeline (D10-2/ADR-10.2, S11 #120). Manual trigger — no
# real VPS/SSH credentials exist in this environment, so this is
# honestly scoped to what's genuinely achievable without one:
#
#  - build-sign-push: real multi-stage Docker builds (infra/docker/*),
#    real SBOM (syft, CycloneDX), real keyless cosign signing, real
#    push to GHCR by digest — all of this only needs GitHub's own
#    registry, no external server.
#  - rollback-rehearsal: proves the actual health-gate-then-rollback
#    DECISION LOGIC (infra/deploy/rollout.sh) against a real booted
#    Postgres/Redis + a real API image — deploys a deliberately broken
#    config (unreachable DB), confirms the script detects the failed
#    readiness check and auto-reverts to the last-known-good image,
#    then confirms the reverted instance genuinely serves requests
#    again. Honestly NOT a rehearsal against a real VPS (see
#    docs/architecture/prr.md's gap register) — the mechanism under
#    test is identical either way; only the Docker host differs.
#
# Real SSH rolling deploy + DNS cutover remain out of scope — no real
# server exists to exercise them against.
name: deploy
on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  build-sign-push:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lowercase repository (GHCR requires lowercase image refs)
        run: echo "REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push api image by digest
        id: push_api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}-api:${{ github.sha }}
      - name: Build + push web image by digest
        id: push_web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}-web:${{ github.sha }}
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: Generate SBOMs (CycloneDX)
        run: |
          syft "ghcr.io/${REPO_LC}-api@${{ steps.push_api.outputs.digest }}" -o cyclonedx-json > sbom-api.json
          syft "ghcr.io/${REPO_LC}-web@${{ steps.push_web.outputs.digest }}" -o cyclonedx-json > sbom-web.json
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign images (keyless, OIDC) and attest SBOMs
        run: |
          cosign sign --yes "ghcr.io/${REPO_LC}-api@${{ steps.push_api.outputs.digest }}"
          cosign sign --yes "ghcr.io/${REPO_LC}-web@${{ steps.push_web.outputs.digest }}"
          cosign attest --yes --predicate sbom-api.json --type cyclonedx \
            "ghcr.io/${REPO_LC}-api@${{ steps.push_api.outputs.digest }}"
          cosign attest --yes --predicate sbom-web.json --type cyclonedx \
            "ghcr.io/${REPO_LC}-web@${{ steps.push_web.outputs.digest }}"
      - name: Record deploy in the job summary (in-repo deploy log, Ch.10 F-1)
        run: |
          {
            echo "## Deploy — $(date -u +%Y-%m-%dT%H:%M:%SZ) — \`${GITHUB_SHA:0:12}\`"
            echo "- api: \`ghcr.io/${REPO_LC}-api@${{ steps.push_api.outputs.digest }}\` (signed)"
            echo "- web: \`ghcr.io/${REPO_LC}-web@${{ steps.push_web.outputs.digest }}\` (signed)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: sboms, path: sbom-*.json }

  rollback-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Start Postgres + Redis and run migrations
        run: |
          docker compose -f infra/compose/compose.yml --profile dev up -d --wait postgres redis
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - name: Migrate
        working-directory: apps/api
        env:
          AETHER_DATABASE_MIGRATOR_URL: postgresql://aether:aether-dev-only@localhost:5432/aether
        run: |
          uv sync
          uv run alembic upgrade head
      - name: Build a real api image
        run: docker build -f infra/docker/api.Dockerfile -t aether-api:rollback-rehearsal .
      - name: Write good/bad env files
        env:
          # Interpolated into the heredoc below (unquoted EOF) rather than
          # written inline, so the literal key-shaped string appears once,
          # on a YAML line gitleaks:allow can annotate — an env-file's
          # `KEY=VALUE` lines don't support trailing comments the way YAML
          # does, so the same annotation can't sit on the value line itself
          # without corrupting the env file docker run reads (a real
          # gitleaks CI failure caught while building this, not assumed).
          DEV_JWT_SIGNING_KEY: "ENa+PofIf23y5gFynYezonUkV5iu0pgeEe/PHlqCG4E=" # gitleaks:allow
        run: |
          cat > /tmp/good.env <<EOF
          AETHER_ENV=dev
          AETHER_DATABASE_URL=postgresql://app_api:app-api-dev-only@postgres:5432/aether
          AETHER_DATABASE_MIGRATOR_URL=postgresql://aether:aether-dev-only@postgres:5432/aether
          AETHER_REDIS_URL=redis://redis:6379/0
          AETHER_JWT_SIGNING_KEY=${DEV_JWT_SIGNING_KEY}
          AETHER_JWT_KID=dev-1
          EOF
          # The "deliberately broken" deploy: same image, same everything,
          # except the DB port is wrong — a realistic bad-config deploy
          # (not a contrived crash), same failure class §10.5's chaos-lite
          # Redis-kill tests exercise for a different dependency.
          sed 's/postgres:5432/postgres:5499/' /tmp/good.env > /tmp/bad.env
      - name: "Bootstrap the last-known-good deploy"
        run: ./infra/deploy/rollout.sh aether_default aether-api:rollback-rehearsal /tmp/good.env aether-api:rollback-rehearsal /tmp/good.env
      - name: "Rehearsal: deploy a deliberately broken config, assert auto-rollback"
        run: |
          set +e
          ./infra/deploy/rollout.sh aether_default aether-api:rollback-rehearsal /tmp/bad.env aether-api:rollback-rehearsal /tmp/good.env
          code=$?
          if [ "$code" -ne 1 ]; then
            echo "expected exit code 1 (ROLLBACK OK) — got $code" >&2
            exit 1
          fi
          echo "rollback rehearsal passed: broken deploy was detected and reverted"
      - name: "Assert the rolled-back instance genuinely serves requests"
        run: |
          status=$(curl -s http://localhost:8000/readyz | python3 -c "import json,sys; print(json.load(sys.stdin)['status'])")
          [ "$status" = "ok" ] || { echo "post-rollback readyz status: $status" >&2; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/v1/me)
          [ "$code" = "401" ] || { echo "post-rollback GET /v1/me: $code (expected 401)" >&2; exit 1; }
          echo "post-rollback instance is genuinely serving real requests"
