# Nightly absolute k6 performance budgets (S9 #98, ADR-2.4, §10.5) —
# same three scripts as ci.yml's perf-smoke job, at higher concurrency
# and duration (closer to "envelope concurrency" than the PR-smoke
# lane's quick check). Still not on genuinely pinned hardware (a real
# gap, documented in infra/k6/README.md) — a shared GitHub Actions
# runner, same posture as eval-nightly.yml/chaos-nightly.yml.

name: perf-nightly

on:
  schedule:
    - cron: "58 7 * * *" # 07:58 UTC daily — offset from eval-nightly (:17) and chaos-nightly (:43)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  perf-nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - name: Start dev infra (Postgres, Redis, MinIO, ClamAV)
        run: |
          docker compose -f infra/compose/compose.yml --profile dev up -d --wait \
            postgres redis minio clamav
      - name: Migrate, provision the bucket, and start the API + worker
        working-directory: apps/api
        env:
          AETHER_ENV: dev
          AETHER_DATABASE_URL: postgresql://app_api:app-api-dev-only@localhost:5432/aether
          AETHER_DATABASE_MIGRATOR_URL: postgresql://aether:aether-dev-only@localhost:5432/aether
          AETHER_DATABASE_WORKER_URL: postgresql://app_worker:app-worker-dev-only@localhost:5432/aether
          AETHER_REDIS_URL: redis://localhost:6379/0
          AETHER_JWT_SIGNING_KEY: "ENa+PofIf23y5gFynYezonUkV5iu0pgeEe/PHlqCG4E=" # gitleaks:allow
          AETHER_JWT_KID: dev-1
        run: |
          uv sync
          uv run alembic upgrade head
          uv run python -c "
          import asyncio
          from aether.adapters.minio.object_storage import MinioObjectStorage
          from aether.config import get_settings
          s = get_settings()
          asyncio.run(MinioObjectStorage(
              endpoint=s.object_storage_endpoint, access_key=s.object_storage_access_key,
              secret_key=s.object_storage_secret_key, secure=s.object_storage_secure,
              bucket=s.object_storage_bucket,
          ).ensure_bucket())
          "
          uv run python -m aether.http.main &
          uv run python -m aether.workers.main &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/readyz && exit 0
            sleep 1
          done
          echo "API never became ready" >&2
          exit 1
      - name: Run k6 performance budgets (nightly concurrency)
        run: |
          for script in non-ai-crud ungrounded-chat; do
            echo "::group::k6 $script"
            docker run --rm --network host \
              -v "${{ github.workspace }}/infra/k6:/scripts:ro" \
              -e AETHER_BASE_URL=http://localhost:8000 -e K6_VUS=10 -e K6_DURATION=2m \
              grafana/k6:0.55.0@sha256:b24f418fc99a26dd57904c952c03bfaf79462be18508acc45aafa07ff68e7df2 \
              run "/scripts/$script.js"
            echo "::endgroup::"
          done
          # grounded-chat runs real per-VU document ingestion against a
          # single-threaded worker consumer (see the script's own header
          # comment) — fewer VUs than the other two even at "nightly"
          # scale, an ingestion-throughput constraint this job isn't
          # trying to budget.
          echo "::group::k6 grounded-chat"
          docker run --rm --network host \
            -v "${{ github.workspace }}/infra/k6:/scripts:ro" \
            -e AETHER_BASE_URL=http://localhost:8000 -e K6_VUS=5 -e K6_DURATION=2m \
            grafana/k6:0.55.0@sha256:b24f418fc99a26dd57904c952c03bfaf79462be18508acc45aafa07ff68e7df2 \
            run /scripts/grounded-chat.js
          echo "::endgroup::"
