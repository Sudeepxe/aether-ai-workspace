# Aether CI (SPRINT_0_PLAN §13). The full pipeline SHAPE ships in Sprint 0;
# lanes for systems that don't exist yet are disabled with `if: false` and a
# comment naming their enabling sprint (Sprint 0 self-review F-1).
#
# All third-party actions are pinned by immutable commit SHA (Ch. 9 F-3);
# the trailing comment on each `uses:` records the human-readable version
# so Renovate/manual bumps stay traceable (SPRINT_0_PLAN §9.5).

name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege default; the security job overrides to add pull-requests:
# read, which gitleaks-action needs to list commits on pull_request events.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - name: Python lint + format + import boundaries
        working-directory: apps/api
        run: |
          uv sync
          uv run ruff format --check .
          uv run ruff check .
          uv run lint-imports --config pyproject.toml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - name: Web lint + typecheck
        working-directory: apps/web
        run: |
          npm ci
          npm run lint
          npm run typecheck
      - name: Python typecheck (mypy --strict)
        working-directory: apps/api
        run: uv run mypy

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - name: Unit + architecture tests
        working-directory: apps/api
        run: |
          uv sync
          uv run pytest -m "unit or architecture" --cov --cov-report=xml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - name: Web unit tests (Vitest)
        working-directory: apps/web
        run: |
          npm ci
          npm run test:coverage

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build images
        run: |
          docker build -f infra/docker/api.Dockerfile -t aether-api:ci .
          docker build -f infra/docker/web.Dockerfile -t aether-web:ci .
      - name: Scan api image (trivy)
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
        with:
          image-ref: aether-api:ci
          severity: CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore
      - name: Scan web image (trivy)
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
        with:
          image-ref: aether-web:ci
          severity: CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # gitleaks-action lists PR commits via the API on pull_request events
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }   # gitleaks scans full history
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - name: Python dependency audit (pip-audit)
        working-directory: apps/api
        run: |
          uv sync
          # --no-emit-project: the local editable aether-api package has no
          # sdist/wheel to hash, and pip-audit only needs third-party deps.
          uv export --no-dev --no-emit-project --format requirements-txt > /tmp/reqs.txt
          uv tool run pip-audit -r /tmp/reqs.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - name: Web dependency audit (npm audit)
        working-directory: apps/web
        run: |
          npm ci
          npm audit --audit-level=critical

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Markdown link check
        uses: lycheeverse/lychee-action@2b973e86fc7b1f6b36a93795fe2c9c6ae1118621 # v1.10.0
        with:
          args: --no-progress --offline docs README.md
          fail: true

  integration:
    # Real Postgres/Redis via testcontainers (docker is preinstalled on
    # ubuntu-latest runners — no service containers/socket setup needed).
    # Security-marked tests run here, not in the `security` job above: they
    # need the same real PG/Redis fixtures (RLS canary, token-lifecycle,
    # authz-matrix), so splitting them would just duplicate the container
    # bring-up for no isolation benefit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - name: Integration + security tests (real PG/Redis)
        working-directory: apps/api
        run: |
          uv sync
          uv run pytest -m "integration or security" --cov --cov-append --cov-report=xml

  e2e:
    # Real Postgres/Redis/MinIO/ClamAV (dev profile) + the real API and
    # worker processes (run directly via uv, not the Docker image —
    # matches how `integration` already runs against real infra without
    # a container build) + a real Chromium browser driving the real Vite
    # dev server. Issue #28's literal acceptance criterion (login -> send
    # message -> see the streamed response settle) and issue #61's (a
    # real document, uploaded through the real UI, produces a real
    # grounded/cited chat reply) both need the full stack — MinIO/ClamAV/
    # worker weren't needed until #61 added a real-ingestion e2e spec.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - name: Start dev infra (Postgres, Redis, MinIO, ClamAV)
        run: |
          docker compose -f infra/compose/compose.yml --profile dev up -d --wait \
            postgres redis minio clamav
      - name: Migrate, provision the bucket, and start the API + worker
        working-directory: apps/api
        env:
          AETHER_ENV: dev
          AETHER_DATABASE_URL: postgresql://app_api:app-api-dev-only@localhost:5432/aether
          AETHER_DATABASE_MIGRATOR_URL: postgresql://aether:aether-dev-only@localhost:5432/aether
          AETHER_DATABASE_WORKER_URL: postgresql://app_worker:app-worker-dev-only@localhost:5432/aether
          AETHER_REDIS_URL: redis://localhost:6379/0
          # Dev-only key, already committed in .env.example (ADR-7.5) —
          # protects nothing outside this ephemeral CI run.
          AETHER_JWT_SIGNING_KEY: "ENa+PofIf23y5gFynYezonUkV5iu0pgeEe/PHlqCG4E=" # gitleaks:allow
          AETHER_JWT_KID: dev-1
        run: |
          uv sync
          uv run alembic upgrade head
          uv run python -c "
          import asyncio
          from aether.adapters.minio.object_storage import MinioObjectStorage
          from aether.config import get_settings
          s = get_settings()
          asyncio.run(MinioObjectStorage(
              endpoint=s.object_storage_endpoint, access_key=s.object_storage_access_key,
              secret_key=s.object_storage_secret_key, secure=s.object_storage_secure,
              bucket=s.object_storage_bucket,
          ).ensure_bucket())
          "
          uv run python -m aether.http.main &
          uv run python -m aether.workers.main &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/readyz && exit 0
            sleep 1
          done
          echo "API never became ready" >&2
          exit 1
      - name: Install Playwright browsers
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run e2e tests
        working-directory: apps/web
        env:
          CI: "true"
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  eval-smoke:
    if: ${{ false }}   # ENABLED IN S7 — 20-case golden smoke, path-filtered (§6.4)
    runs-on: ubuntu-latest
    steps: [{ run: "echo enabled in S7" }]

  perf-smoke:
    if: ${{ false }}   # ENABLED IN S9 — k6 relative-regression budgets (ADR-2.4)
    runs-on: ubuntu-latest
    steps: [{ run: "echo enabled in S9" }]
